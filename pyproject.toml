[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saina"
version = "0.1.0rc1"
description = "Saina HTTP SDK and optional Helm model inference"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.urls]
Homepage = "https://saina.run"
Repository = "https://github.com/saina-run/saina"

[project.optional-dependencies]
local = ["torch>=2.5,<3", "transformers>=5.3,<6", "accelerate>=1,<2", "peft>=0.21,<0.22", "safetensors>=0.4,<1", "huggingface-hub>=0.27,<2"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["src"]
