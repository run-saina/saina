[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saina"
version = "0.10.2"
description = "Saina HTTP SDK and optional Helm model inference"
authors = [{ name = "Saina", email = "dev@saina.run" }]
maintainers = [{ name = "Saina", email = "dev@saina.run" }]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.urls]
Homepage = "https://saina.run"
Repository = "https://github.com/run-saina/saina"

[project.scripts]
saina = "saina.cli:main"

[project.optional-dependencies]
local = ["torch>=2.5,<3", "transformers>=5.3,<6", "accelerate>=1,<2", "safetensors>=0.4,<1", "huggingface-hub>=0.27,<2", "pydantic>=2.9,<3"]
mlx = ["mlx-lm==0.32.0", "huggingface-hub>=0.27,<2"]
gguf = ["numpy>=2,<3", "safetensors>=0.4,<1", "transformers>=5.3,<6"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "backports-zstd>=1,<2; python_version < \"3.14\""]
tokenize = ["transformers>=5.3,<6", "huggingface-hub>=0.27,<2", "jinja2>=3,<4", "pydantic>=2.9,<3"]
media = ["pillow>=10,<13", "numpy>=2,<3", "scipy>=1.11,<2", "soundfile>=0.12,<1"]

[tool.setuptools.package-data]
saina = ["ui/**/*", "local-releases.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["gpu: needs a CUDA GPU and SAINA_TEST_MULTIMODAL_CHECKPOINT"]
