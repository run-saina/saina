# Publish to PyPI with Trusted Publishing (no stored token): pushing a v* tag builds the sdist and wheel and uploads
# them. The PyPI project "saina" trusts this repository, this workflow file and the "pypi" environment.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  contracts:
    uses: ./.github/workflows/contracts.yml
  pypi:
    needs: contracts
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches the package version
        run: test "v$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "$GITHUB_REF_NAME"
      - name: Build
        run: python -m pip install -q build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
