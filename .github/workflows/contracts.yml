name: SDK contract tests
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_call:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU contract test dependencies
        run: python -m pip install '.[server,media]' pytest httpx safetensors
      - name: Verify required test dependencies
        run: python -c 'import fastapi, httpx, numpy, PIL, scipy, soundfile; from backports import zstd; from saina.server import create_app'
      - name: Python contracts, billing and clients (mocked inference)
        run: python -m pytest -q tests/test_traces.py tests/test_decisions.py tests/test_server.py tests/test_billing.py tests/test_client.py tests/test_media.py tests/test_artifacts.py tests/test_local.py tests/test_releases.py tests/test_cli.py tests/test_model_manager.py
      - name: JavaScript client contracts
        working-directory: clients/javascript
        run: node --test
