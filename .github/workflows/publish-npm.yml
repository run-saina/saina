# Publish @run-saina/sdk to npm with Trusted Publishing (no stored token). A push to main that changes
# clients/javascript/package.json runs the contract tests and publishes the new version when it is not on npm yet.
# The npm package trusts this repository and this workflow file. The JavaScript client is versioned separately from
# the v* PyPI tags.
name: publish-npm
on:
  push:
    branches: [main]
    paths: [clients/javascript/package.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    defaults:
      run:
        working-directory: clients/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skip when this version is already on npm
        id: check
        run: |
          if [ -n "$(npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version)" ]; then
            echo "Version already published, nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
  contracts:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/contracts.yml
  publish:
    needs: contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: clients/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0
      - run: npm publish --provenance --access public
